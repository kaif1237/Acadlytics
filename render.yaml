services:
  - type: web
    name: acadivance-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/acadivance.db
    # The FastAPI lifespan initializes missing tables on startup.
    disk:
      name: acadivance-data
      mountPath: /var/data
      sizeGB: 1
